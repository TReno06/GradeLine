# GradeLine — deploy the Vite build to GitHub Pages (PLAN.md Stage 4).
#
# Runs in the public TReno06/GradeLine repo, whose root is this GradeLine/
# folder (paths below — app/package.json, app/dist — are relative to it);
# live at https://treno06.github.io/GradeLine/. Pages is set to
# Settings -> Pages -> Source: "GitHub Actions" there. Inert in any repo
# where this folder is nested (Actions only reads .github/workflows at the
# real repo root), e.g. the private working copy it's synced from.
name: Deploy GradeLine to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
