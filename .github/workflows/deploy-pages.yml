# GradeLine — deploy the Vite build to GitHub Pages (PLAN.md Stage 4).
#
# DORMANT while this folder lives nested inside a larger repo: GitHub
# Actions only reads .github/workflows at the actual repo root, and today
# that root is one level up from here. This file is written as if
# GradeLine/ itself is the repo root (paths below — app/package.json,
# app/dist — are relative to that future root) because the plan is to
# split GradeLine into its own repo once Stage 4 is tested and confirmed
# working. Once that split happens, this workflow starts running as-is,
# no edits needed. Until then it's inert — it won't appear in Actions at
# all for the current (nested) location.
#
# Also requires, as a one-time manual step after the split (neither of
# which this workflow or any automated tool does on your behalf):
# Settings -> Pages -> Source: "GitHub Actions", on a public repo (or a
# private one on a paid plan that supports Pages).
name: Deploy GradeLine to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
